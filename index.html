<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Проверка пароля</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
    <h1>Проверка пароля 🔐</h1>
    <p class="subtitle">Введите пароль</p>
    <input id="passwordInput" type="text">
    <button onclick="checkPassword()">Проверить</button>
    <div class="rules">
        <div id="ruleLength">❌ символов: 0 / 8</div>
        <div id="ruleUpper">❌ есть большая буква</div>
        <div id="ruleLower">❌ есть маленькая буква</div>
        <div id="ruleNumber">❌ есть цифра</div>
        <div id="ruleSymbol">❌ есть символ (!@#$)</div>
    </div>
</div>


<div class="modal" id="resultModal">
    <div class="modal-content">
        <h2 id="resultTitle"></h2>
        <img id="resultGif">
        <button onclick="closeModal()">OK</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
